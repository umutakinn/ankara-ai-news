name: Ankara Haber Takibi

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ankara-haber-takibi
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Her çalışmada en son state önbelleğini geri yükle.
      # Yeni run_id anahtarı sayesinde her çalışmanın sonunda yeni
      # state önbelleği kaydedilebilir; sabit anahtar kullanılmaz.
      - name: Önceki haber kayıtlarını yükle
        uses: actions/cache@v4
        with:
          path: state.json
          key: ankara-news-state-${{ github.run_id }}
          restore-keys: |
            ankara-news-state-

      - name: Gerekli paketleri yükle
        run: pip install -r requirements.txt

      - name: Haberleri tara
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
