name: Ankara Haber Takibi

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      button_test:
        description: "Telegram onay butonlarını test mesajıyla dene"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ankara-haber-takibi
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Her çalışmada en son state önbelleğini geri yükle.
      # Yeni run_id anahtarı sayesinde her çalışmanın sonunda yeni
      # state önbelleği kaydedilebilir; sabit anahtar kullanılmaz.
      - name: Önceki haber kayıtlarını yükle
        uses: actions/cache@v4
        with:
          path: state.json
          key: ankara-news-state-${{ github.run_id }}
          restore-keys: |
            ankara-news-state-

      - name: Gerekli paketleri yükle
        run: pip install -r requirements.txt

      - name: Telegram buton testi
        if: ${{ inputs.button_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          keyboard = {
              "inline_keyboard": [[
                  {"text": "✅ Instagram'da Paylaş", "callback_data": "approve:test-button"},
                  {"text": "❌ Reddet", "callback_data": "reject:test-button"}
              ]]
          }
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "🧪 TEST HABERİ — GERÇEK DEĞİLDİR\\n\\n📰 Ankara'da test amaçlı örnek bir gelişme başlığı\\n📍 Ankara (temsili)\\n🔎 Bu içerik yalnızca buton denemesi içindir; gerçek haber değildir ve Instagram'da paylaşılmaz.",
                  "reply_markup": keyboard,
                  "disable_web_page_preview": True
              },
              timeout=20
          )
          data = response.json()
          if not response.ok or not data.get("ok"):
              raise SystemExit(f"Telegram test gönderimi başarısız: {data}")
          print("Telegram buton test mesajı gönderildi.")
          PY

      - name: Haberleri tara
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
